<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduGrade AI · Demo access</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      color: #242424; background: #f5f5f5; font-family: "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(440px, 100%); padding: 36px; border: 1px solid #d1d1d1;
      border-radius: 8px; background: white; box-shadow: 0 4px 18px rgba(0,0,0,.1);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .mark {
      width: 40px; height: 40px; display: grid; place-items: center;
      border-radius: 6px; color: white; background: #0f6cbd; font-size: 20px; font-weight: 700;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 24px; color: #616161; line-height: 1.55; }
    label { display: grid; gap: 8px; font-size: 13px; font-weight: 600; }
    input {
      width: 100%; padding: 13px; border: 1px solid #8a8886; border-radius: 4px;
      font: 24px "Segoe UI"; letter-spacing: 8px; text-align: center; outline: none;
    }
    input:focus { border-color: #0f6cbd; box-shadow: 0 0 0 1px #0f6cbd; }
    button {
      width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 4px;
      color: white; background: #0f6cbd; font: 600 15px "Segoe UI"; cursor: pointer;
    }
    button:hover { background: #115ea3; }
    #error { min-height: 20px; margin: 12px 0 0; color: #c50f1f; font-size: 12px; }
    .note { margin-top: 24px; padding-top: 18px; border-top: 1px solid #e1dfdd; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark">E</div><strong>EduGrade AI</strong></div>
    <h1>Open the mentor demo</h1>
    <p>Enter the six-digit access code shared with you by the EduGrade team.</p>
    <form id="access-form">
      <label>Access code
        <input id="access-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required autofocus>
      </label>
      <button type="submit">Continue to EduGrade</button>
      <div id="error" role="alert"></div>
    </form>
    <p class="note">The code grants temporary access to this hackathon demo. Do not enter student-sensitive information.</p>
  </main>
  <script>
    document.querySelector("#access-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const error = document.querySelector("#error");
      error.textContent = "";
      const response = await fetch("/api/access", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: document.querySelector("#access-code").value }),
      });
      if (!response.ok) {
        const body = await response.json();
        error.textContent = body.detail || "Access could not be verified.";
        return;
      }
      window.location.replace("/");
    });
  </script>
</body>
</html>
